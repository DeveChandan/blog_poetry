<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180" fill="none">
  <defs>
    <filter id="magShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="-8" dy="12" stdDeviation="8" flood-color="#3c2a1e" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="pageEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5e5e5"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
    <linearGradient id="coverShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#faf6ee"/>
      <stop offset="100%" stop-color="#ede4d0"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="mountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <g filter="url(#magShadow)">
    <!-- Back Pages Thickness Depth -->
    <path d="M 22 25 L 34 16 L 142 22 L 130 166 L 22 160 Z" fill="#d4cbb8" stroke="#a89f8c" stroke-width="0.8"/>
    <!-- Page Block Edges (White sheets) -->
    <path d="M 26 23 L 36 16 L 144 22 L 134 167 L 26 161 Z" fill="url(#pageEdge)"/>
    <path d="M 30 21 L 38 15 L 146 21 L 138 168 L 30 162 Z" fill="#f5f5f5"/>

    <!-- Front Magazine Cover (Perspective tilted) -->
    <polygon points="36,15 146,21 138,168 28,162" fill="url(#coverShine)" stroke="#c2b69d" stroke-width="1"/>
    
    <!-- Spine Shadow Accent -->
    <polygon points="28,162 36,15 42,16 34,163" fill="#000000" opacity="0.08"/>

    <!-- Magazine Cover Header -->
    <text x="86" y="38" font-family="serif" font-size="11" font-weight="bold" fill="#2c1a0e" text-anchor="middle" letter-spacing="1">RSUNKAHI</text>
    <text x="86" y="48" font-family="serif" font-size="6.5" font-style="italic" fill="#6b4c35" text-anchor="middle">Quarterly Magazine</text>
    <line x1="52" y1="52" x2="120" y2="53" stroke="#c5a059" stroke-width="0.75"/>

    <!-- Framed Cover Artwork (Scenic Landscape) -->
    <rect x="46" y="58" width="80" height="92" rx="2" fill="#fdfbf7" stroke="#bfa370" stroke-width="1.2"/>
    
    <g transform="translate(48, 60)">
      <clipPath id="artClip">
        <rect width="76" height="88" rx="1"/>
      </clipPath>
      <g clip-path="url(#artClip)">
        <!-- Sky -->
        <rect width="76" height="50" fill="url(#skyGrad)"/>
        <!-- Sun -->
        <circle cx="56" cy="22" r="8" fill="#fef08a" opacity="0.8"/>
        <!-- Distant Mountains -->
        <polygon points="-5,45 22,20 44,38 65,18 85,45" fill="url(#mountGrad)" opacity="0.6"/>
        <polygon points="5,48 35,28 58,44 78,25 85,48" fill="url(#mountGrad)"/>
        <!-- Valley & Foothills -->
        <path d="M 0 45 Q 38 40 76 46 L 76 88 L 0 88 Z" fill="#365314"/>
        <!-- River winding -->
        <path d="M 42 46 Q 36 62 48 72 Q 58 80 40 88 L 30 88 Q 48 76 30 65 Q 32 52 38 46 Z" fill="url(#riverGrad)"/>
        <!-- Foreground Tree Silhouette -->
        <path d="M 68 88 L 68 62 M 66 68 Q 60 55 68 52 Q 76 55 70 68" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="68" cy="56" r="9" fill="#14532d" opacity="0.9"/>
      </g>
    </g>

    <!-- Cover Gloss Sheen Reflection -->
    <polygon points="36,15 90,18 50,163 28,162" fill="#ffffff" opacity="0.15"/>
  </g>
</svg>