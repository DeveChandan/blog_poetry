<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150" fill="none">
  <defs>
    <radialGradient id="bokeh1" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chromeH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="20%" stop-color="#9ca3af"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d1d5db"/>
      <stop offset="85%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="goldRib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="micShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Warm Bokeh Orbs in Background -->
  <circle cx="28" cy="40" r="24" fill="url(#bokeh1)"/>
  <circle cx="85" cy="55" r="18" fill="url(#bokeh2)"/>
  <circle cx="45" cy="100" r="26" fill="url(#bokeh3)"/>
  <circle cx="15" cy="85" r="14" fill="url(#bokeh2)"/>
  <circle cx="95" cy="25" r="12" fill="url(#bokeh1)"/>

  <!-- Vintage Microphone Object with Shadow -->
  <g filter="url(#micShadow)">
    <!-- Swivel Arch / U-Mount behind head -->
    <path d="M 28 65 C 28 98, 88 98, 88 65" stroke="url(#chromeH)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="65" r="4.5" fill="url(#chromeH)"/>
    <circle cx="88" cy="65" r="4.5" fill="url(#chromeH)"/>

    <!-- Stem and Stand Base -->
    <rect x="54" y="90" width="8" height="24" rx="2" fill="url(#chromeH)"/>
    <ellipse cx="58" cy="114" rx="14" ry="4.5" fill="url(#chromeH)"/>
    <rect x="55" y="114" width="6" height="18" fill="url(#chromeH)"/>
    
    <!-- Cast Iron Stand Round Base -->
    <ellipse cx="58" cy="134" rx="30" ry="8" fill="url(#chromeH)"/>
    <ellipse cx="58" cy="132" rx="26" ry="6" fill="#1f2937" opacity="0.8"/>
    <ellipse cx="58" cy="131" rx="22" ry="5" stroke="url(#goldRib)" stroke-width="1.5" fill="none"/>

    <!-- Microphone Capsule Shell -->
    <rect x="34" y="15" width="48" height="70" rx="24" fill="#0f172a" stroke="url(#chromeH)" stroke-width="3"/>

    <!-- Vintage Horizontal Grille Louvers -->
    <line x1="37" y1="28" x2="79" y2="28" stroke="url(#chromeH)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35.5" y1="36" x2="80.5" y2="36" stroke="url(#chromeH)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="44" x2="81" y2="44" stroke="url(#chromeH)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="52" x2="81" y2="52" stroke="url(#chromeH)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35.5" y1="60" x2="80.5" y2="60" stroke="url(#chromeH)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="37.5" y1="68" x2="78.5" y2="68" stroke="url(#chromeH)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="41" y1="76" x2="75" y2="76" stroke="url(#chromeH)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center Vertical Chrome Fin Rib -->
    <path d="M 58 15 L 58 85" stroke="url(#chromeH)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 57.5 15 L 57.5 85" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  </g>
</svg>